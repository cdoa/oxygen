<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════
     OXYGEN — GitHub Pages front door
     This page does ONE thing: send visitors to the OXYGEN Apps
     Script web app.

     It used to show the app inside a full-screen iframe, which hid
     Google's Apps Script banner. That stopped working: browsers now
     block third-party cookies by default, so Google never received
     the visitor's session inside the frame and answered 401. A
     top-level redirect carries the session normally, so sign-in
     works for everyone — at the cost of showing Google's banner.

     ►► IF YOU EVER CREATE A NEW APPS SCRIPT DEPLOYMENT (new /exec
        URL), update the ONE line marked "APP URL" below. ◄◄
     ══════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OXYGEN — Confident Daffodils Owners Association</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='82' cy='100' r='62' fill='none' stroke='%2306B6D4' stroke-width='26'/%3E%3Ctext x='138' y='158' font-family='Arial' font-weight='800' font-size='72' fill='%2322D3EE'%3E2%3C/text%3E%3C/svg%3E">

  <!-- ▼▼▼ APP URL — the only line to change after a new deployment ▼▼▼ -->
  <meta http-equiv="refresh"
        content="0; url=https://script.google.com/macros/s/AKfycbzrnL4jWaOYxUiyrco-lJTeb3Txvi471xl6SBI7p_tQW-NGighahdVNywhEGpGh4Ndr/exec">
  <!-- ▲▲▲ APP URL ▲▲▲ -->

  <link rel="canonical" href="https://script.google.com/macros/s/AKfycbzrnL4jWaOYxUiyrco-lJTeb3Txvi471xl6SBI7p_tQW-NGighahdVNywhEGpGh4Ndr/exec">
  <meta name="robots" content="noindex">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #04101c; }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #9FB8CC;
      font-family: Arial, Helvetica, sans-serif; font-size: 14px;
      text-align: center; padding: 0 16px;
    }
    .ring {
      width: 46px; height: 46px;
      border: 4px solid rgba(6,182,212,.2);
      border-top-color: #06B6D4;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #22D3EE; }
    #manual { font-size: 13px; color: #6E8599; }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation-duration: 3s; }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="ring"></div>
    <div>Opening OXYGEN…</div>
    <div id="manual">
      Not redirected?
      <a id="link" href="https://script.google.com/macros/s/AKfycbzrnL4jWaOYxUiyrco-lJTeb3Txvi471xl6SBI7p_tQW-NGighahdVNywhEGpGh4Ndr/exec">Open OXYGEN →</a>
    </div>
  </div>

  <script>
    // Belt and braces: the meta refresh above handles browsers with
    // JavaScript disabled; this fires immediately where it is on.
    // replace() rather than assign() so this page leaves no history
    // entry — otherwise Back from the app would bounce straight here
    // and forward again, trapping the visitor.
    (function () {
      var url = document.getElementById('link').href;
      try { window.location.replace(url); }
      catch (e) { window.location.href = url; }
    })();
  </script>

</body>
</html>
